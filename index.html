<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marry SMM Panel</title>
<style>
:root{--bg:#f3f6f4;--ink:#12261f;--mute:#5d6f67;--card:#fff;--line:#d5dfd9;--brand:#0f6b4f;--brand-ink:#fff;--warn:#b3261e;--ok:#0f6b4f}
@media (prefers-color-scheme:dark){:root{--bg:#0e1714;--ink:#e6f0eb;--mute:#8da39a;--card:#16221d;--line:#26362f;--brand:#3ccf9b;--brand-ink:#06251a;--warn:#ff8a80;--ok:#3ccf9b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Trebuchet MS","Segoe UI",Roboto,sans-serif}
main{max-width:460px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.5rem;margin:24px 0 4px}
h2{font-size:1.1rem;margin:0 0 12px}
p{margin:0 0 12px;color:var(--mute)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-top:16px}
label{display:block;font-size:.9rem;margin:12px 0 4px}
input,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
button{width:100%;margin-top:16px;padding:12px;border:0;border-radius:8px;background:var(--brand);color:var(--brand-ink);font:inherit;font-weight:700;cursor:pointer}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
button:disabled{opacity:.6}
.tabs{display:flex;gap:8px}
.tabs button{margin:0}
.tabs button:not(.on){background:transparent;color:var(--mute);border:1px solid var(--line)}
.bal{font-size:2.4rem;font-weight:700;margin:4px 0}
.msg{margin-top:12px;font-size:.9rem;min-height:1.2em}
.msg.err{color:var(--warn)}.msg.ok{color:var(--ok)}
.row{display:flex;justify-content:space-between;gap:8px;padding:10px 0;border-top:1px solid var(--line);font-size:.9rem}
.tag{font-weight:700}
.hide{display:none}
</style>
</head>
<body>
<main>
  <h1>Marry SMM Panel</h1>

  <!-- Logged out -->
  <section id="auth" class="card hide">
    <div class="tabs">
      <button id="tabIn" class="on" type="button">Log in</button>
      <button id="tabUp" type="button">Sign up</button>
    </div>
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="email">
    <label for="pass">Password</label>
    <input id="pass" type="password" autocomplete="current-password" minlength="6">
    <button id="go" type="button">Log in</button>
    <button id="google" class="ghost" type="button">Continue with Google</button>
    <div id="authMsg" class="msg" role="alert"></div>
  </section>

  <!-- Logged in -->
  <section id="app" class="hide">
    <div class="card">
      <p id="who"></p>
      <p>Your balance</p>
      <div class="bal">Rs <span id="bal">0</span></div>
      <button id="out" class="ghost" type="button">Log out</button>
    </div>

    <div class="card">
      <h2>Add funds</h2>
      <p>Send the payment to our account, then enter the details below. We add the funds after we confirm it.</p>
      <label for="method">Payment method</label>
      <select id="method">
        <option>JazzCash</option>
        <option>Easypaisa</option>
        <option>Bank transfer</option>
      </select>
      <label for="amount">Amount (Rs)</label>
      <input id="amount" type="number" min="100" inputmode="numeric">
      <label for="txn">Transaction ID</label>
      <input id="txn" type="text">
      <button id="fund" type="button">Submit payment</button>
      <div id="fundMsg" class="msg" role="alert"></div>
    </div>

    <div class="card">
      <h2>New order</h2>
      <label for="cat">Category</label>
      <select id="cat"></select>
      <label for="svc">Service</label>
      <select id="svc"></select>
      <p id="svcInfo"></p>
      <label for="link">Link</label>
      <input id="link" type="url" placeholder="https://">
      <label for="qty">Quantity</label>
      <input id="qty" type="number" inputmode="numeric">
      <p id="cost"></p>
      <button id="order" type="button">Place order</button>
      <div id="orderMsg" class="msg" role="alert"></div>
    </div>

    <div class="card">
      <h2>Your orders</h2>
      <div id="orders"><p>No orders yet.</p></div>
    </div>

    <div class="card">
      <h2>Your payments</h2>
      <div id="list"><p>No payments yet.</p></div>
    </div>
  </section>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, createUserWithEmailAndPassword, signInWithEmailAndPassword, signInWithPopup, GoogleAuthProvider, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, addDoc, collection, query, where, getDocs, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyCfuyn5MAKM3TkF9GcETTDtRImbSIOlxE4",
  authDomain: "marrysmmpanel.firebaseapp.com",
  projectId: "marrysmmpanel",
  storageBucket: "marrysmmpanel.firebasestorage.app",
  messagingSenderId: "503895050596",
  appId: "1:503895050596:web:71081ca7257304e58f5271"
});
const auth = getAuth(app);
const db = getFirestore(app);
const $ = id => document.getElementById(id);
let mode = "in";

const say = (el, text, type) => { el.textContent = text; el.className = "msg " + (type || ""); };
const nice = e => ({
  "auth/invalid-credential": "Wrong email or password.",
  "auth/email-already-in-use": "This email already has an account. Log in instead.",
  "auth/weak-password": "Password must be at least 6 characters.",
  "auth/invalid-email": "Enter a valid email address.",
  "auth/unauthorized-domain": "This site's domain is not allowed in Firebase. Add it under Authentication > Settings > Authorized domains.",
  "auth/popup-closed-by-user": "Google sign-in was closed. Try again."
}[e.code] || e.message);

function setMode(m){
  mode = m;
  $("tabIn").className = m === "in" ? "on" : "";
  $("tabUp").className = m === "up" ? "on" : "";
  $("go").textContent = m === "in" ? "Log in" : "Create account";
  $("pass").autocomplete = m === "in" ? "current-password" : "new-password";
  say($("authMsg"), "");
}
$("tabIn").onclick = () => setMode("in");
$("tabUp").onclick = () => setMode("up");

async function ensureUser(user){
  const ref = doc(db, "users", user.uid);
  const snap = await getDoc(ref);
  if (!snap.exists()) await setDoc(ref, { email: user.email, balance: 0, createdAt: serverTimestamp() });
}

$("go").onclick = async () => {
  const email = $("email").value.trim(), pass = $("pass").value;
  if (!email || !pass) return say($("authMsg"), "Enter your email and password.", "err");
  $("go").disabled = true;
  try {
    const cred = mode === "in"
      ? await signInWithEmailAndPassword(auth, email, pass)
      : await createUserWithEmailAndPassword(auth, email, pass);
    await ensureUser(cred.user);
  } catch (e) { say($("authMsg"), nice(e), "err"); }
  $("go").disabled = false;
};

$("google").onclick = async () => {
  try {
    const cred = await signInWithPopup(auth, new GoogleAuthProvider());
    await ensureUser(cred.user);
  } catch (e) { say($("authMsg"), nice(e), "err"); }
};

$("out").onclick = () => signOut(auth);

$("fund").onclick = async () => {
  const amount = Number($("amount").value), txn = $("txn").value.trim();
  if (!(amount >= 100)) return say($("fundMsg"), "Minimum amount is Rs 100.", "err");
  if (txn.length < 4) return say($("fundMsg"), "Enter the transaction ID from your payment.", "err");
  $("fund").disabled = true;
  try {
    await addDoc(collection(db, "deposits"), {
      uid: auth.currentUser.uid, email: auth.currentUser.email,
      method: $("method").value, amount, txn,
      status: "pending", createdAt: Date.now()
    });
    $("amount").value = ""; $("txn").value = "";
    say($("fundMsg"), "Payment submitted. We will add the funds after we confirm it.", "ok");
    loadData();
  } catch (e) { say($("fundMsg"), "Could not submit. " + e.message, "err"); }
  $("fund").disabled = false;
};

async function loadData(){
  const u = auth.currentUser; if (!u) return;
  try {
    const me = await getDoc(doc(db, "users", u.uid));
    $("bal").textContent = me.exists() ? me.data().balance : 0;
    const res = await getDocs(query(collection(db, "deposits"), where("uid", "==", u.uid)));
    const items = res.docs.map(d => d.data()).sort((a, b) => b.createdAt - a.createdAt);
    $("list").innerHTML = items.length ? "" : "<p>No payments yet.</p>";
    items.forEach(d => {
      const r = document.createElement("div"); r.className = "row";
      const l = document.createElement("span"); l.textContent = d.method + " · Rs " + d.amount;
      const s = document.createElement("span"); s.className = "tag"; s.textContent = d.status;
      r.append(l, s); $("list").append(r);
    });
  } catch (e) { say($("fundMsg"), "Could not load your data. " + e.message, "err"); }
}

let svcs = [];
const cur = () => svcs.find(s => String(s.id) === $("svc").value);
function showCost(){
  const s = cur();
  $("svcInfo").textContent = s ? "Rs " + s.rate + " per 1000 · min " + s.min + " · max " + s.max : "";
  const q = Number($("qty").value);
  $("cost").textContent = s && q ? "Total: about Rs " + (Math.ceil(s.rate * q / 1000 * 100) / 100) : "";
}
function fillSvc(){
  $("svc").innerHTML = "";
  svcs.filter(s => s.category === $("cat").value).forEach(s => $("svc").add(new Option(s.name, s.id)));
  showCost();
}
async function loadServices(){
  try {
    const r = await fetch("/.netlify/functions/services");
    svcs = await r.json();
    if (!Array.isArray(svcs)) throw new Error(svcs.error || "Failed");
    $("cat").innerHTML = "";
    [...new Set(svcs.map(s => s.category))].forEach(c => $("cat").add(new Option(c, c)));
    fillSvc();
  } catch (e) { say($("orderMsg"), "Could not load services. " + e.message, "err"); }
}
async function loadOrders(){
  const u = auth.currentUser; if (!u) return;
  try {
    const res = await getDocs(query(collection(db, "orders"), where("uid", "==", u.uid)));
    const items = res.docs.map(d => d.data()).sort((a, b) => b.createdAt - a.createdAt);
    $("orders").innerHTML = items.length ? "" : "<p>No orders yet.</p>";
    items.forEach(d => {
      const r = document.createElement("div"); r.className = "row";
      const l = document.createElement("span"); l.textContent = d.serviceName.slice(0, 40) + " · " + d.quantity;
      const s = document.createElement("span"); s.className = "tag"; s.textContent = "Rs " + d.charge;
      r.append(l, s); $("orders").append(r);
    });
  } catch (e) { say($("orderMsg"), "Could not load orders. " + e.message, "err"); }
}
$("cat").onchange = fillSvc; $("svc").onchange = showCost; $("qty").oninput = showCost;
$("order").onclick = async () => {
  const s = cur();
  if (!s) return say($("orderMsg"), "Choose a service.", "err");
  $("order").disabled = true; say($("orderMsg"), "Placing order...");
  try {
    const token = await auth.currentUser.getIdToken();
    const r = await fetch("/.netlify/functions/order", {
      method: "POST",
      headers: { "Content-Type": "application/json", Authorization: "Bearer " + token },
      body: JSON.stringify({ service: s.id, link: $("link").value.trim(), quantity: $("qty").value })
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || "Order failed");
    say($("orderMsg"), "Order placed. Rs " + d.charge + " was taken from your balance.", "ok");
    $("link").value = ""; $("qty").value = ""; showCost();
    loadData(); loadOrders();
  } catch (e) { say($("orderMsg"), e.message, "err"); }
  $("order").disabled = false;
};

onAuthStateChanged(auth, user => {
  $("auth").classList.toggle("hide", !!user);
  $("app").classList.toggle("hide", !user);
  if (user) { $("who").textContent = user.email; ensureUser(user).then(() => { loadData(); loadOrders(); }); if (!svcs.length) loadServices(); }
});
</script>
</body>
</html>
